<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PPL Verano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0907; --s1:#141210; --s2:#1e1b17; --line:#2e2924;
  --foam:#f0ece4; --muted:#7a7060;
  --push:#f5a623; --pull:#3dd68c; --legs:#7b8ff5;
  --heavy:#ff5c5c; --acc:#f5a623; --green:#3dd68c;
  --tab-h:66px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:15px;}
body{
  background:var(--bg);color:var(--foam);font-family:'DM Sans',sans-serif;
  min-height:100dvh;padding-bottom:calc(var(--tab-h) + 14px);overflow-x:hidden;
}

/* HEADER + MODE SWITCH */
.site-head{
  padding:16px 14px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;background:rgba(10,9,7,.95);backdrop-filter:blur(10px);
}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.head-title{font-family:'Bebas Neue';font-size:26px;letter-spacing:.04em;line-height:1;}
.head-title small{display:block;font-family:'DM Sans';font-size:9.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.mode-switch{
  display:flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;
}
.mode-switch button{
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-family:'Bebas Neue';font-size:14px;letter-spacing:.08em;
  padding:8px 14px;border-radius:8px;transition:.15s;line-height:1;
}
.mode-switch button.on{background:var(--acc);color:var(--bg);}

/* DAY TABS (bottom) */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(10,9,7,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);height:var(--tab-h);
  display:flex;padding:0 2px env(safe-area-inset-bottom,0px);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;border:none;background:transparent;color:var(--muted);
  font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  position:relative;transition:.15s;font-family:'DM Sans';
}
.tab::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:transparent;transition:.2s;border-radius:0 0 2px 2px;}
.tab.on{color:var(--foam);}
.tab.push.on::before{background:var(--push);}
.tab.pull.on::before{background:var(--pull);}
.tab.legs.on::before{background:var(--legs);}
.tab .ti{font-size:17px;line-height:1;}

/* PAGES */
main{padding:0 13px;}
.hidden{display:none!important;}

/* SESSION INTRO */
.sess-intro{margin:13px 0 12px;padding:11px 13px;border-radius:13px;border:1px solid;}
.sess-intro.push{background:rgba(245,166,35,.08);border-color:rgba(245,166,35,.2);}
.sess-intro.pull{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.2);}
.sess-intro.legs{background:rgba(123,143,245,.08);border-color:rgba(123,143,245,.2);}
.si-top{display:flex;align-items:center;gap:9px;}
.si-emoji{font-size:24px;}
.si-title{font-family:'Bebas Neue';font-size:21px;letter-spacing:.03em;line-height:1;}
.si-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
.si-warn{margin-top:9px;padding:8px 10px;background:rgba(255,92,92,.1);
  border:1px solid rgba(255,92,92,.2);border-radius:8px;font-size:10.5px;color:#ff8f8f;line-height:1.4;}

/* ══ GUÍA CARDS ══ */
.ex-card{background:var(--s2);border:1px solid var(--line);border-radius:15px;margin-bottom:12px;overflow:hidden;animation:up .3s ease both;}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;}}
.ex-img-wrap{width:100%;height:170px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--s1);}
.ex-img-wrap img{width:100%;height:100%;object-fit:contain;}
.ex-fb{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:7px;}
.ex-fb .fe{font-size:48px;}
.ex-fb .fl{font-family:'Bebas Neue';letter-spacing:.1em;font-size:12px;color:var(--muted);}
.ex-strip{height:3px;}
.push-strip{background:var(--push);} .pull-strip{background:var(--pull);} .legs-strip{background:var(--legs);}
.ex-body{padding:12px 13px 13px;}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ex-name{font-family:'Bebas Neue';font-size:22px;letter-spacing:.02em;line-height:1;flex:1;}
.scheme-pill{font-family:'Bebas Neue';font-size:14px;letter-spacing:.04em;background:var(--s1);
  border:1px solid var(--line);padding:5px 9px;border-radius:7px;white-space:nowrap;}
.pct-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;margin-top:8px;}
.pc-heavy{background:rgba(255,92,92,.15);color:#ff8f8f;}
.pc-mod{background:rgba(245,166,35,.15);color:var(--acc);}
.pc-lite{background:rgba(61,214,140,.15);color:var(--green);}
.info-grid{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
.ib{background:var(--s1);border-radius:9px;padding:9px 10px;border-left:2px solid var(--line);}
.ib.zone{border-left-color:#a78bfa;} .ib.tech{border-left-color:var(--muted);}
.ib.rests{border-left-color:#38bdf8;} .ib.vars{border-left-color:#fb923c;}
.il{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted);margin-bottom:3px;}
.it{font-size:12px;line-height:1.5;}
.it em{color:#c4b5fd;font-style:normal;font-weight:600;}
.rest-row{display:flex;gap:6px;flex-wrap:wrap;}
.rc{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:rgba(56,189,248,.1);color:#7dd3fc;}
.vi{font-size:11px;color:var(--muted);padding:2px 0;display:flex;gap:6px;}
.vi::before{content:"→";color:#fb923c;flex:0 0 auto;}

/* ══ REGISTRO ══ */
.rm-banner{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:12px;margin:13px 0 0;}
.rm-banner h2{font-family:'Bebas Neue';font-size:16px;letter-spacing:.06em;margin-bottom:2px;}
.rm-banner p{font-size:10.5px;color:var(--muted);margin-bottom:10px;line-height:1.4;}
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.rm-item label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
.rm-row{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.rm-row input{flex:1;width:100%;background:transparent;border:none;color:var(--foam);
  font-family:'Bebas Neue';font-size:20px;padding:6px 7px;outline:none;}
.rm-row .u{font-size:10px;color:var(--muted);padding:0 8px 0 2px;font-weight:700;}
.weekbar{display:flex;align-items:center;gap:10px;margin:11px 0 0;background:var(--s2);
  border:1px solid var(--line);border-radius:12px;padding:7px 11px;}
.weekbar .lbl{font-family:'Bebas Neue';letter-spacing:.1em;font-size:13px;color:var(--muted);}
.stepper{display:flex;align-items:center;gap:8px;margin-left:auto;}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--s1);color:var(--foam);font-size:19px;font-weight:700;cursor:pointer;}
.stepper button:active{background:var(--acc);color:var(--bg);}
.wknum{font-family:'Bebas Neue';font-size:28px;min-width:50px;text-align:center;color:var(--acc);}
.reg-card{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px;position:relative;overflow:hidden;animation:up .3s ease both;}
.reg-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}
.reg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.reg-name{font-family:'Bebas Neue';font-size:19px;line-height:1;flex:1;}
.reg-scheme{font-family:'Bebas Neue';font-size:13px;background:var(--s1);border:1px solid var(--line);padding:4px 8px;border-radius:6px;white-space:nowrap;}
.target-line{display:flex;align-items:center;justify-content:space-between;margin-top:8px;
  background:var(--s1);border-radius:8px;padding:7px 10px;}
.target-line .tl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;}
.target-line .tv{font-family:'Bebas Neue';font-size:16px;color:var(--acc);letter-spacing:.03em;}
.input-row{display:flex;align-items:center;gap:9px;margin-top:9px;}
.input-row label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;}
.wt-wrap{margin-left:auto;display:flex;align-items:center;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;transition:.2s;}
.wt-wrap input{width:82px;background:transparent;border:none;color:var(--foam);
  font-family:'Bebas Neue';font-size:25px;text-align:right;padding:7px 5px 7px 11px;outline:none;}
.wt-wrap.filled{border-color:#a06d10;}
.wt-wrap.filled input{color:var(--acc);}
.wt-wrap .unit{font-size:11px;color:var(--muted);padding:0 10px 0 4px;font-weight:700;}
.last-entry{font-size:10px;color:var(--muted);margin-top:5px;text-align:right;min-height:12px;}
.last-entry b{color:var(--green);}

/* TOAST + RESET */
.toast{position:fixed;bottom:calc(var(--tab-h) + 14px);left:50%;transform:translateX(-50%) translateY(100px);
  font-family:'Bebas Neue';letter-spacing:.1em;font-size:13px;padding:10px 20px;border-radius:30px;
  transition:.3s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.toast.ok{background:var(--acc);color:var(--bg);}
.toast.err{background:var(--heavy);color:#fff;}
.toast.show{transform:translateX(-50%) translateY(0);}
.reset{width:100%;margin:18px 0 8px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:11.5px;font-weight:600;padding:12px;border-radius:10px;cursor:pointer;}
.reset:active{border-color:var(--heavy);color:var(--heavy);}
.notes-block{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:13px;margin:14px 0 8px;}
.notes-block h3{font-family:'Bebas Neue';font-size:15px;letter-spacing:.06em;color:var(--acc);margin-bottom:7px;}
.notes-block p{font-size:11px;color:var(--muted);line-height:1.5;}
.notes-block p+p{margin-top:5px;}
.notes-block b{color:var(--foam);}

/* ══ TIMERS (session + rest) ══ */
.timer-row{position:relative;height:32px;margin-top:10px;}
.timer-session{
  display:flex;align-items:center;gap:8px;height:100%;cursor:pointer;
  transition:opacity .2s;
}
.timer-session.compact{opacity:0;pointer-events:none;position:absolute;inset:0;}
.ts-dot{width:7px;height:7px;border-radius:50%;background:var(--dcol,var(--acc));flex:0 0 auto;}
.ts-dot.live{animation:tsBlink 1.4s ease-in-out infinite;}
@keyframes tsBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
.ts-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted);}
.ts-val{font-family:'Bebas Neue';font-size:18px;letter-spacing:.03em;color:var(--foam);}
.ts-hint{font-size:9px;color:var(--muted);margin-left:auto;}
.timer-rest{
  position:absolute;inset:0;display:flex;align-items:center;gap:10px;
  background:rgba(245,166,35,.14);
  background:color-mix(in srgb, var(--dcol,var(--acc)) 14%, transparent);
  border:1px solid var(--dcol,var(--acc));border-radius:10px;padding:0 8px 0 12px;
  animation:restPulse 1.6s ease-in-out infinite;
}
.timer-rest.hidden{display:none;}
.timer-rest.paused{animation:none;opacity:.7;}
.timer-rest.done{background:rgba(61,214,140,.18);border-color:var(--green);animation:none;}
@keyframes restPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--dcol,var(--acc)) 35%, transparent);}
  50%{box-shadow:0 0 0 4px transparent;}}
.tr-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--dcol,var(--acc));white-space:nowrap;}
.tr-val{font-family:'Bebas Neue';font-size:23px;letter-spacing:.03em;color:var(--foam);margin-left:auto;}
.tr-actions{display:flex;gap:6px;}
.tr-btn{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--s1);
  color:var(--foam);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tr-btn:active{background:var(--dcol,var(--acc));color:var(--bg);}
.tr-cancel{color:#ff8f8f;}

.rest-start-btn{
  margin-top:8px;width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);
  background:var(--s1);color:var(--foam);font-family:'Bebas Neue';letter-spacing:.06em;
  font-size:13px;cursor:pointer;transition:.15s;
}
.rest-start-btn:active{background:var(--dcol,var(--acc));color:var(--bg);border-color:var(--dcol,var(--acc));}
</style>
</head>
<body>

<div class="site-head" id="siteHead">
  <div class="head-row">
    <div class="head-title"><small>Energy Fit · Verano</small><span id="headDay">PUSH A</span></div>
    <div class="mode-switch">
      <button id="modeGuia" class="on">Guía</button>
      <button id="modeReg">Registro</button>
    </div>
  </div>
  <div class="timer-row" id="timerRow">
    <div class="timer-session" id="timerSession" title="Toca para iniciar/reiniciar">
      <span class="ts-dot" id="tsDot"></span>
      <span class="ts-label">Sesión</span>
      <span class="ts-val" id="sessVal">00:00</span>
      <span class="ts-hint" id="tsHint">Toca para empezar</span>
    </div>
    <div class="timer-rest hidden" id="timerRest">
      <span class="tr-label" id="restLabel">Descanso</span>
      <span class="tr-val" id="restVal">00:00</span>
      <div class="tr-actions">
        <button class="tr-btn" id="restPauseBtn" type="button">⏸</button>
        <button class="tr-btn tr-cancel" id="restCancelBtn" type="button">✕</button>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="guiaView"></div>
  <div id="regView" class="hidden"></div>
</main>

<nav class="tab-bar" id="tabBar"></nav>
<div class="toast" id="toast"></div>

/* ═══════ STATE & STORAGE ═══════ */
const STORE='ppl-verano-pwa-v1';
const COLORS={push:'#f5a623',pull:'#3dd68c',legs:'#7b8ff5'};
const PC={heavy:'pc-heavy',mod:'pc-mod',lite:'pc-lite'};
let state={mode:'guia',day:'pa',week:1};
let weights={},rms={},saveTimer=null;
let storageOK=false;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');storageOK=true;}catch(e){}

function load(){
  try{const raw=localStorage.getItem(STORE);
    if(raw){const p=JSON.parse(raw);weights=p.weights||{};rms=p.rms||{};if(p.state)state={...state,...p.state};}
  }catch(e){}
}
function save(){
  if(!storageOK){showToast('No se pudo guardar ⚠',false);return;}
  try{localStorage.setItem(STORE,JSON.stringify({weights,rms,state}));showToast('Guardado ✓',true);}
  catch(e){showToast('Error al guardar ⚠',false);}
}
function qSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,500);}
function showToast(m,ok){
  const t=document.getElementById('toast');t.textContent=m;
  t.className='toast '+(ok?'ok':'err')+' show';
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),1300);
}
const wKey=(d,i,w)=>`${d}-${i}-w${w}`;
const rmK=k=>`rm-${k}`;
function lastEntry(d,i,w){for(let x=w-1;x>=1;x--){const v=weights[wKey(d,i,x)];if(v)return{w:x,v};}return null;}
function target(ex){
  if(!ex.rm)return null;
  const rv=rms[rmK(ex.rm)];if(!rv)return null;
  const lo=Math.round(rv*ex.pct[0]/100/2.5)*2.5, hi=Math.round(rv*ex.pct[1]/100/2.5)*2.5;
  return `${lo}–${hi} kg`;
}

/* ═══════ TIMERS (sesión + descanso) ═══════ */
let sessionStartAt=null, sessionInt=null;
let restState=null; // {day,idx,name,total,endAt,remaining,paused}
let restInt=null;
let wakeLock=null;
let audioCtx=null;

function fmtMMSS(totalSec){
  totalSec=Math.max(0,Math.round(totalSec));
  const m=Math.floor(totalSec/60), s=totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function parseRestSeconds(txt){
  const m=txt.match(/(\d+(?:[.,]\d+)?)\s*(min|s)\b/i);
  if(!m)return 60;
  const n=parseFloat(m[1].replace(',','.'));
  return Math.round(m[2].toLowerCase()==='min'?n*60:n);
}

function startSession(){
  if(sessionStartAt)return;
  sessionStartAt=Date.now();
  clearInterval(sessionInt);
  sessionInt=setInterval(updateSessionUI,1000);
  updateSessionUI();
}
function resetSession(){
  sessionStartAt=null;
  clearInterval(sessionInt);
  updateSessionUI();
}
function ensureSession(){ if(!sessionStartAt) startSession(); }
function updateSessionUI(){
  const val=document.getElementById('sessVal');
  const dot=document.getElementById('tsDot');
  const hint=document.getElementById('tsHint');
  if(!val)return;
  const running=!!sessionStartAt;
  val.textContent=running?fmtMMSS((Date.now()-sessionStartAt)/1000):'00:00';
  if(dot)dot.classList.toggle('live',running);
  if(hint)hint.textContent=running?'Toca para reiniciar':'Toca para empezar';
}

function startRest(dayId,idx,ex){
  ensureSession();
  const sec=parseRestSeconds(ex.rests[0]);
  clearInterval(restInt);
  restState={day:dayId,idx,name:ex.name,total:sec,endAt:Date.now()+sec*1000,paused:false,remaining:sec};
  requestWakeLock();
  showRestUI();
  restInt=setInterval(tickRest,250);
  tickRest();
}
function tickRest(){
  if(!restState||restState.paused)return;
  const remaining=(restState.endAt-Date.now())/1000;
  if(remaining<=0){ finishRest(); return; }
  updateRestUI(remaining);
}
function finishRest(){
  clearInterval(restInt);
  updateRestUI(0);
  playBeep();
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
  releaseWakeLock();
  setTimeout(()=>{ restState=null; hideRestUI(); },2500);
}
function pauseResumeRest(){
  if(!restState)return;
  if(restState.paused){
    restState.endAt=Date.now()+restState.remaining*1000;
    restState.paused=false;
    clearInterval(restInt);
    restInt=setInterval(tickRest,250);
    requestWakeLock();
  }else{
    restState.remaining=(restState.endAt-Date.now())/1000;
    restState.paused=true;
    clearInterval(restInt);
    releaseWakeLock();
  }
  updateRestUI(restState.paused?restState.remaining:(restState.endAt-Date.now())/1000);
}
function cancelRest(){
  clearInterval(restInt);
  restState=null;
  releaseWakeLock();
  hideRestUI();
}
function updateRestUI(remaining){
  const val=document.getElementById('restVal');
  const label=document.getElementById('restLabel');
  const bar=document.getElementById('timerRest');
  const pauseBtn=document.getElementById('restPauseBtn');
  if(!val||!bar)return;
  val.textContent=fmtMMSS(remaining);
  bar.classList.toggle('done',remaining<=0);
  bar.classList.toggle('paused',!!(restState&&restState.paused));
  if(pauseBtn)pauseBtn.textContent=restState&&restState.paused?'▶':'⏸';
  if(label)label.textContent=remaining<=0?'¡Descanso terminado!':(restState&&restState.paused?'Pausado':'Descanso');
}
function showRestUI(){
  document.getElementById('timerRest').classList.remove('hidden');
  document.getElementById('timerSession').classList.add('compact');
}
function hideRestUI(){
  const el=document.getElementById('timerRest');
  if(el)el.classList.add('hidden');
  document.getElementById('timerSession').classList.remove('compact');
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null;});
    }
  }catch(e){ wakeLock=null; }
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}

function playBeep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;
    for(let i=0;i<3;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,now+i*0.3);
      g.gain.exponentialRampToValueAtTime(0.35,now+i*0.3+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.3+0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+i*0.3); o.stop(now+i*0.3+0.3);
    }
  }catch(e){}
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    updateSessionUI();
    if(restState){
      if(!restState.paused){
        const remaining=(restState.endAt-Date.now())/1000;
        if(remaining<=0)finishRest(); else{ updateRestUI(remaining); requestWakeLock(); }
      }
    }
  }
});

function renderGuia(){
  const d=DAYS.find(x=>x.id===state.day);
  const warn=d.warn?`<div class="si-warn">${d.warn}</div>`:'';
  document.getElementById('guiaView').innerHTML=`
    <div class="sess-intro ${d.type}">
      <div class="si-top"><div class="si-emoji">${d.icon}</div>
        <div><div class="si-title">${d.label} — ${d.sub}</div><div class="si-sub">${d.focus}</div></div>
      </div>${warn}
    </div>
    ${d.ex.map((e,i)=>guiaCard(e,i,d.type)).join('')}
    <div class="notes-block">
      <h3>📋 Notas</h3>
      <p><b>Calentamiento (5 min):</b> movilidad + 1 serie al 50% y otra al 65% del primer ejercicio.</p>
      <p><b>Progresión:</b> completa el techo de reps en todas las series → +2.5 kg la siguiente semana.</p>
      <p><b>Descarga:</b> cada 4-5 semanas, mitad de volumen (2 series en vez de 3-4).</p>
    </div>`;
  document.querySelectorAll('#guiaView .rest-start-btn').forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.dataset.idx,10);
      startRest(d.id,i,d.ex[i]);
    };
  });
}

/* ═══════ REGISTRO VIEW ═══════ */
function renderReg(){
  const d=DAYS.find(x=>x.id===state.day);
  const rmInputs=RM_KEYS.map(({k,label})=>{
    const v=rms[rmK(k)]||'';
    return `<div class="rm-item"><label>${label}</label>
      <div class="rm-row"><input type="number" inputmode="decimal" placeholder="0" value="${v}" data-rm="${k}"><span class="u">kg</span></div></div>`;
  }).join('');
  const cards=d.ex.map((ex,i)=>{
    const k=wKey(state.day,i,state.week);
    const val=weights[k]||'';
    const last=lastEntry(state.day,i,state.week);
    const lastTxt=last?`Sem ${last.w}: <b>${last.v} kg</b>`:'';
    const tg=target(ex);
    const tgHtml=tg?`<div class="target-line"><span class="tl">Objetivo (${ex.pctTxt})</span><span class="tv">${tg}</span></div>`
                   :`<div class="target-line"><span class="tl">Referencia</span><span class="tv">${ex.pctTxt}</span></div>`;
    return `<div class="reg-card" style="animation-delay:${i*35}ms">
      <div class="reg-accent" style="background:${COLORS[d.type]}"></div>
      <div class="reg-top"><div class="reg-name">${ex.name}</div><div class="reg-scheme">${ex.scheme}</div></div>
      ${tgHtml}
      <div class="input-row"><label>Peso usado</label>
        <div class="wt-wrap ${val?'filled':''}" data-wrap="${i}">
          <input type="number" inputmode="decimal" step="0.5" placeholder="0" value="${val}" data-i="${i}">
          <span class="unit">kg</span>
        </div>
      </div>
      <div class="last-entry">${lastTxt}</div>
    </div>`;
  }).join('');
  document.getElementById('regView').innerHTML=`
    <div class="rm-banner">
      <h2>Tus 1RM estimados</h2>
      <p>Se usan para calcular la carga objetivo. Aproxima si no lo sabes exacto.</p>
      <div class="rm-grid">${rmInputs}</div>
    </div>
    <div class="weekbar"><span class="lbl">Semana</span>
      <div class="stepper"><button id="wkDown">−</button><span class="wknum" id="wkNum">${state.week}</span><button id="wkUp">+</button></div>
    </div>
    <div style="height:12px"></div>
    ${cards}
    <button class="reset" id="resetBtn">Borrar todos los registros</button>`;

  document.querySelectorAll('#regView input[data-rm]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const k=rmK(e.target.dataset.rm);
      if(e.target.value)rms[k]=parseFloat(e.target.value);else delete rms[k];
      qSave();
      // refresh targets without full rerender losing focus: update target lines only
      document.querySelectorAll('#regView .reg-card').forEach((card,i)=>{
        const ex=d.ex[i];const tg=target(ex);
        const tv=card.querySelector('.tv');
        if(tv)tv.textContent=tg||ex.pctTxt;
      });
    });
  });
  document.querySelectorAll('#regView input[data-i]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=e.target.dataset.i;
      const k=wKey(state.day,i,state.week);
      const wrap=document.querySelector(`#regView [data-wrap="${i}"]`);
      if(e.target.value){weights[k]=e.target.value;wrap.classList.add('filled');}
      else{delete weights[k];wrap.classList.remove('filled');}
      qSave();
    });
  });
  document.getElementById('wkUp').onclick=()=>{if(state.week<52){state.week++;renderReg();qSave();}};
  document.getElementById('wkDown').onclick=()=>{if(state.week>1){state.week--;renderReg();qSave();}};
  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('¿Seguro? Se borran todos los pesos y 1RMs.')){
      weights={};rms={};state={mode:'reg',day:'pa',week:1};
      try{localStorage.removeItem(STORE);}catch(e){}
      renderAll();
    }
  };
}

/* ═══════ SHARED ═══════ */
function renderTabs(){
  document.getElementById('tabBar').innerHTML=DAYS.map(d=>
    `<button class="tab ${d.type} ${d.id===state.day?'on':''}" data-id="${d.id}"
      style="${d.id===state.day?`color:${COLORS[d.type]}`:''}">
      <span class="ti">${d.icon}</span><span>${d.label}</span>
    </button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    if(t.dataset.id!==state.day){resetSession();cancelRest();}
    state.day=t.dataset.id;renderAll();qSave();window.scrollTo({top:0,behavior:'smooth'});
  });
}
function renderHead(){
  const d=DAYS.find(x=>x.id===state.day);
  document.getElementById('headDay').textContent=d.label.toUpperCase();
  document.getElementById('timerRow').style.setProperty('--dcol',COLORS[d.type]);
}
function renderMode(){
  const g=state.mode==='guia';
  document.getElementById('guiaView').classList.toggle('hidden',!g);
  document.getElementById('regView').classList.toggle('hidden',g);
  document.getElementById('modeGuia').classList.toggle('on',g);
  document.getElementById('modeReg').classList.toggle('on',!g);
}
function renderAll(){renderTabs();renderHead();renderMode();renderGuia();renderReg();}

document.getElementById('modeGuia').onclick=()=>{state.mode='guia';renderMode();qSave();};
document.getElementById('modeReg').onclick=()=>{state.mode='reg';renderMode();qSave();};

document.getElementById('timerSession').onclick=()=>{
  if(!sessionStartAt){startSession();}
  else if(confirm('¿Reiniciar el cronómetro de sesión?')){resetSession();}
};
document.getElementById('restPauseBtn').onclick=pauseResumeRest;
document.getElementById('restCancelBtn').onclick=cancelRest;

/* ═══════ INIT + SW ═══════ */
load();renderAll();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
